# =============================================================================
#  Experiment campaign (our scaled-down version of paper Table 2)
# =============================================================================
# EVERY member runs the SAME campaign on THEIR OWN machine. The three
# laptops play the role of the paper's three systems (Broadwell /
# Cascade-Lake / EPYC). Do not change this file on your own: agree in the
# group chat, change it in one commit, and everyone re-runs what changed.
#
# Sections:
#   fixed    -> each portfolio algorithm alone (needed for Oracle, Fig. 4, Fig. 6)
#   expert   -> RandomSel / ExhaustiveSel / ExpertSel       (Member B code)
#   rl       -> Q-Learn / SARSA with LT and LIB rewards     (Member C code)
#   chunks   -> one traced loop instance per algorithm      (Fig. 1 / Fig. 2)
#   rl_sweep -> alpha/gamma sensitivity for RQ2 (optional)  (Member C)
#
# Every section is run with chunk_modes = default and exp (expChunk).
# =============================================================================

[defaults]
apps        = ["mandelbrot", "stream", "tc"]
chunk_modes = ["default", "exp"]
timesteps   = 500       # same as the paper: RL learning = 144/500 = 28.8%
reps        = 5         # paper: median of 5 repetitions
size        = "small"   # problem-size preset, see runtime/src/apps/apps.cpp
max_seconds = 90        # per-run safety cap on loop time; runs that hit it are
                        # marked truncated and extrapolated (STREAM + SS!)
timeout     = 600       # hard wall-clock kill per run (s)
threads     = 0         # 0 = all physical cores, detected automatically
shuffle     = true      # randomise run order within a repetition (thermal drift)
sections    = ["fixed", "expert", "rl"]   # what `make campaign` runs
portfolio   = []        # [] = all 12. Never change for the final campaign; for
                        # preliminary runs use `ARGS="--portfolio STATIC,SS,GSS"`

[fixed]
algorithms = ["STATIC", "SS", "GSS", "TSS", "StaticSteal", "mFAC2",
              "AWF-B", "AWF-C", "AWF-D", "AWF-E", "mAF", "AutoLLVM"]

[expert]
methods = ["randomsel", "exhaustivesel", "expertsel"]

[rl]
methods = ["qlearn", "sarsa"]
rewards = ["LT", "LIB"]

[chunks]
app       = "mandelbrot"   # paper uses SPHYNX; we trace Mandelbrot loop L0
timesteps = 3              # trace the 2nd instance (adaptive algos have history)
trace_timestep = 1

[rl_sweep]
apps        = ["mandelbrot"]
methods     = ["qlearn", "sarsa"]
rewards     = ["LT"]
chunk_modes = ["exp"]
alphas      = [0.1, 0.5, 0.9]
gammas      = [0.1, 0.5, 0.9]
reps        = 3

# ---------------------------------------------------------------- profiles
# `--profile NAME` overrides [defaults]. `smoke` checks the pipeline in ~1 min.
[profiles.smoke]
timesteps   = 20
reps        = 1
size        = "tiny"
max_seconds = 10
timeout     = 60

[profiles.quick]          # preliminary results for the slides (~15-25 min)
timesteps   = 200
reps        = 2

[profiles.full]           # the real thing (~1-3 h depending on the machine)
